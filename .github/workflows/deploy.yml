name: Deploy (simulado)

# Dispara apenas quando o workflow "CI" termina com sucesso em main: o deploy so acontece se o
# quality gate (testes + cobertura) passou. E a prova concreta do pilar Quality Gate.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build do jar
        run: mvn -B -DskipTests package

      - name: Simular deploy
        run: |
          echo "Quality gate aprovado em main - simulando deploy de target/ai-helpdesk.jar"
          echo "Nao ha infraestrutura real de destino neste projeto de demonstracao;"
          echo "este passo existe para provar o gate, nao para realizar um deploy real."
          ls -la target/*.jar
