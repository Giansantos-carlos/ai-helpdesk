name: Code Review

on:
  pull_request:

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Checkstyle/SpotBugs rodam aqui, nao em ci.yml, para nao pagar o custo duas vezes
      # (ver comentario no pom.xml). Isso representa a parte automatizada do pilar Code Review;
      # a parte humana e o CODEOWNERS + PULL_REQUEST_TEMPLATE.md.
      - name: Checkstyle
        run: mvn -B checkstyle:check

      - name: SpotBugs
        run: mvn -B compile spotbugs:check

      - name: Semgrep (SAST)
        uses: semgrep/semgrep-action@v1
        with:
          config: p/java
        continue-on-error: true
