spring:
  application:
    name: ai-helpdesk
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/helpdesk}
    username: ${DB_USERNAME:helpdesk}
    password: ${DB_PASSWORD:helpdesk}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # Cada modulo tem sua propria pasta, mas os numeros de versao (V1, V2, ...) sao globais
    # entre todas as locations combinadas - o Flyway rejeita "V1" duplicado mesmo em pastas
    # diferentes. Por isso a sequencia abaixo e continua: user=V1, knowledgebase=V2, ticket=V3-V4,
    # assistant=V5, em vez de cada modulo reiniciar em V1.
    locations: >
      classpath:db/migration/shared,
      classpath:db/migration/user,
      classpath:db/migration/knowledgebase,
      classpath:db/migration/ticket,
      classpath:db/migration/assistant
  modulith:
    republish-outstanding-events-on-restart: false

server:
  port: ${SERVER_PORT:8080}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-sonnet-4-5}
  base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com/v1}
  max-output-tokens: ${ANTHROPIC_MAX_TOKENS:1024}

app:
  assistant:
    context:
      max-messages: ${CONTEXT_MAX_MESSAGES:10}
      max-kb-articles: ${CONTEXT_MAX_KB_ARTICLES:3}
      max-chars-budget: ${CONTEXT_MAX_CHARS_BUDGET:6000}

logging:
  level:
    com.giansantos.helpdesk: INFO
